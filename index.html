      Static <link rel="canonical"> for the homepage. usePageMeta.ts
      updates this tag's href on route change for Googlebot (which
      executes JS), but social-preview bots (Facebook/LinkedIn/X/WhatsApp
      crawlers, iMessage link previews) generally do NOT execute
      JavaScript — they only ever see this file's static content. Anyone
      sharing a link to a page other than "/" will still get this
      homepage preview in their unfurl card, not that page's own
      title/description/image. Properly fixing that requires prerendering
      or SSR per route, which this Vite SPA doesn't do; flagging this as
      a known limitation rather than silently leaving it undocumented.
    -->

        #lb-boot{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;font-family:system-ui,sans-serif}
        @media (prefers-color-scheme:dark){#lb-boot{background:#0a1620}}
        #lb-boot .r{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
        #lb-boot .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,#0057D9 45%,#22D3EE 60%,transparent 75%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:lbs 1.1s linear infinite}
        #lb-boot .halo{position:absolute;inset:0;border-radius:50%;background:rgba(0,87,217,.2);animation:lbh 1.8s ease-out infinite}
        #lb-boot img{width:48px;height:48px;position:relative;animation:lbp 1.6s ease-in-out infinite}
        @keyframes lbs{to{transform:rotate(360deg)}}@keyframes lbh{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.8);opacity:0}}@keyframes lbp{50%{transform:scale(.92)}}
      </style>
